services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lifecycle
      POSTGRES_PASSWORD: lifecycle
      POSTGRES_DB: lifecycle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifecycle"]
      interval: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lifecycle:lifecycle@db:5432/lifecycle
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
