name: Dashboard and suite tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r 09-dashboard/requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check 09-dashboard/static/app.js
      - run: node --check 09-dashboard/static/platform.js
